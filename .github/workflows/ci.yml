# CI: main への push と手動実行で動く。
#   test          Python の試験（uv + pytest）
#   firmware      XIAO nRF52840 Sense 向けスケッチのコンパイル（必須）
#   firmware-mg24 XIAO MG24 Sense 向けのコンパイル（次点。落ちても全体は落とさない）
#   docs          章に貼った出力を走らせ直して比べる（python -m physlearn.docs_check）
# アクションは今日（2026-11-19）の最新の版に固定した。上げるときは意識して上げる。
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 偽の XIAO の試験は仮想の時刻で回る（壁時計に依らない）ので、全体で 1 分ほど。固まったときの上限。
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg # 描画なし（MuJoCo も描画せずに動く）
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3 # Python は uv が .python-version を読む
      - run: uv sync --locked --extra mujoco --extra viz
      # 失敗した試験のやり直しはしない（不安定さを隠さない。偽の XIAO の試験は壁時計に依らず、負荷でも落ちない）。
      - run: uv run pytest -q

  docs:
    # 章の中のコマンドを shell=True でそのまま実行する（docs_check の冒頭の注意）。第三者の PR の章を走らせると
    # 任意のコードが動くので、main への push と手動実行のときだけ動かす。将来 pull_request を on に足しても動かない形。
    # permissions は contents: read のまま、シークレットは渡さない。
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # ローカルで全章 23〜37 秒（負荷が高いと 100 秒）+ uv sync。固まったときの上限。
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --extra mujoco --extra viz
      # 差があれば失敗。「飛ばした」が増えても気づけるよう、最後に件数を 1 行で出す（表は道具の章ごとの行を足す）。
      - run: |
          set -o pipefail
          rc=0
          uv run python -m physlearn.docs_check --mujoco | tee docs_check.txt || rc=$?
          awk -F'\t' '$2 ~ /^一致 [0-9]+$/ { split($2,a," "); split($3,b," "); split($4,c," "); m+=a[2]; d+=b[2]; s+=c[2] }
                      END { printf "docs_check 合計: 一致 %d / 差 %d / 飛ばした %d\n", m, d, s }' docs_check.txt
          exit $rc

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FQBN: Seeeduino:nrf52:xiaonRF52840Sense
    steps:
      - uses: actions/checkout@v7.0.1
      # コンパイルの最後に書き込み用の zip を作るため、python と adafruit-nrfutil が PATH に要る（doc/setup.md 2.3）。
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - run: pip install adafruit-nrfutil==0.5.3.post16
      - uses: arduino/setup-arduino-cli@v2.1.0
        with:
          version: 1.6.0
      - run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          arduino-cli core update-index
          arduino-cli core install Seeeduino:nrf52@1.1.13
          arduino-cli lib install "Seeed Arduino LSM6DS3@2.0.8"
      - run: arduino-cli compile --fqbn "$FQBN" firmware/xiao_imu_drive

  firmware-mg24:
    runs-on: ubuntu-latest
    # ローカルで一度もコンパイルできていない（コアが約 650 MB）。スケッチの #if が通るかは CI で初めて分かる。
    continue-on-error: true
    timeout-minutes: 45
    env:
      # protocol_stack=none: 無線を使わない最小のスタック。
      FQBN: SiliconLabs:silabs:xiao_mg24:protocol_stack=none
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: arduino/setup-arduino-cli@v2.1.0
        with:
          version: 1.6.0
      - run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://siliconlabs.github.io/arduino/package_arduinosilabs_index.json
          arduino-cli core update-index
          arduino-cli core install SiliconLabs:silabs@5.0.0
          arduino-cli lib install "Seeed Arduino LSM6DS3@2.0.8"
      - run: arduino-cli compile --fqbn "$FQBN" firmware/xiao_imu_drive
