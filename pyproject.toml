[project]
name = "physlearn"
version = "0.1.0"
description = "Physical AI (Sim2Real & Real2Sim) を XIAO + IMU で学ぶ教材とコード"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
    { name = "asari300" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pyserial>=3.5",
]

[project.scripts]
physlearn = "physlearn:main"

[project.optional-dependencies]
mujoco = [
    "mujoco>=4.0.1",
]
viz = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
